# Builds the AIV X iPhone app on a cloud Mac and sends it to TestFlight.
# Run it from GitHub: Actions tab > "iOS app" > Run workflow.
# Needs these repository secrets (Settings > Secrets and variables > Actions):
#   APPLE_TEAM_ID              10-character Team ID (developer.apple.com > Membership)
#   ASC_KEY_ID                 App Store Connect API key ID
#   ASC_ISSUER_ID              App Store Connect API issuer ID
#   ASC_KEY_P8                 the full text of the AuthKey_XXXX.p8 file
#   GOOGLE_SERVICE_INFO_PLIST  the full text of GoogleService-Info.plist from Firebase
name: iOS app

on:
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload to TestFlight"
        type: boolean
        default: true
      screenshots:
        description: "Also take App Store screenshots in the iPhone Simulator"
        type: boolean
        default: false

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testflight:
    if: ${{ inputs.upload }}
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install Capacitor and sync the iOS project
        run: |
          npm ci
          npx cap sync ios

      - name: Add Firebase config and App Store Connect key
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          ASC_KEY_ID=$(printf '%s' "$ASC_KEY_ID" | tr -d ' \r\n\t'); ASC_ISSUER_ID=$(printf '%s' "${ASC_ISSUER_ID:-}" | tr -d ' \r\n\t'); TEAM=$(printf '%s' "${TEAM:-}" | tr -d ' \r\n\t')
          printf '%s' "$GOOGLE_SERVICE_INFO_PLIST" | tr -d '\r' > ios/App/App/GoogleService-Info.plist
          plutil -lint ios/App/App/GoogleService-Info.plist
          REVERSED=$(/usr/libexec/PlistBuddy -c "Print :REVERSED_CLIENT_ID" ios/App/App/GoogleService-Info.plist)
          echo "GOOGLE_REVERSED_CLIENT_ID=$REVERSED" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/keys"
          KEY_FILE="$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
          # Clean up the pasted key: drop Windows line endings, the BEGIN/END lines and spaces,
          # then rebuild a proper PEM file (works whether it was pasted with or without those lines)
          BODY=$(printf '%s' "$ASC_KEY_P8" | tr -d '\r' | sed 's/-----[^-]*-----//g' | tr -d ' \n\t')
          {
            echo "-----BEGIN PRIVATE KEY-----"
            printf '%s' "$BODY" | fold -w 64
            echo
            echo "-----END PRIVATE KEY-----"
          } > "$KEY_FILE"
          if ! openssl pkey -in "$KEY_FILE" -noout 2>/dev/null; then
            echo "::error::ASC_KEY_P8 is not a valid private key. Open AuthKey_${ASC_KEY_ID}.p8 (the App Store Connect API key, not the push key) in Notepad and paste ALL of it into the ASC_KEY_P8 secret again."
            exit 1
          fi
          echo "App Store Connect API key looks valid."

      - name: Check the App Store Connect API key with Apple
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          ASC_KEY_ID=$(printf '%s' "$ASC_KEY_ID" | tr -d ' \r\n\t'); ASC_ISSUER_ID=$(printf '%s' "${ASC_ISSUER_ID:-}" | tr -d ' \r\n\t'); TEAM=$(printf '%s' "${TEAM:-}" | tr -d ' \r\n\t')
          KID=$(printf '%s' "$ASC_KEY_ID" | tr -d ' \r\n\t')
          ISS=$(printf '%s' "$ASC_ISSUER_ID" | tr -d ' \r\n\t')
          echo "Key ID is ${#KID} characters (should be 10). Issuer ID is ${#ISS} characters (should be 36)."
          python3 - "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" "$KID" "$ISS" <<'PY'
          import base64, json, subprocess, sys, time, urllib.request, urllib.error
          key, kid, iss = sys.argv[1:4]
          b64 = lambda b: base64.urlsafe_b64encode(b).rstrip(b"=")
          now = int(time.time())
          msg = b64(json.dumps({"alg":"ES256","kid":kid,"typ":"JWT"}).encode()) + b"." + b64(json.dumps({"iss":iss,"iat":now,"exp":now+600,"aud":"appstoreconnect-v1"}).encode())
          der = subprocess.run(["openssl","dgst","-sha256","-sign",key], input=msg, capture_output=True, check=True).stdout
          # DER signature -> raw r||s
          i = 2 if der[1] < 0x80 else 3
          rl = der[i+1]; r = der[i+2:i+2+rl]; j = i+2+rl; sl = der[j+1]; s_ = der[j+2:j+2+sl]
          raw = r[-32:].rjust(32, b"\0") + s_[-32:].rjust(32, b"\0")
          token = (msg + b"." + b64(raw)).decode()
          req = urllib.request.Request("https://api.appstoreconnect.apple.com/v1/apps?limit=5", headers={"Authorization": "Bearer " + token})
          try:
              data = json.load(urllib.request.urlopen(req))
              print("Apple accepted the API key. Apps on this account:", [a["attributes"]["bundleId"] for a in data["data"]])
          except urllib.error.HTTPError as e:
              print("::error::Apple rejected the API key (HTTP %d). ASC_KEY_P8 must be the API key file AuthKey_%s.p8 from App Store Connect > Users and Access > Integrations (not the push key), and ASC_KEY_ID / ASC_ISSUER_ID must be copied from that same page." % (e.code, kid))
              print(e.read().decode()[:500])
              sys.exit(1)
          PY

      - name: Archive (signed automatically with the API key)
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          ASC_KEY_ID=$(printf '%s' "$ASC_KEY_ID" | tr -d ' \r\n\t'); ASC_ISSUER_ID=$(printf '%s' "${ASC_ISSUER_ID:-}" | tr -d ' \r\n\t'); TEAM=$(printf '%s' "${TEAM:-}" | tr -d ' \r\n\t')
          set -o pipefail
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/AIVX.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM" \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            GOOGLE_REVERSED_CLIENT_ID="$GOOGLE_REVERSED_CLIENT_ID" \
            | tail -n 60

      - name: Upload to TestFlight
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          ASC_KEY_ID=$(printf '%s' "$ASC_KEY_ID" | tr -d ' \r\n\t'); ASC_ISSUER_ID=$(printf '%s' "${ASC_ISSUER_ID:-}" | tr -d ' \r\n\t'); TEAM=$(printf '%s' "${TEAM:-}" | tr -d ' \r\n\t')
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/AIVX.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "Build ${{ github.run_number }} uploaded. It shows up in App Store Connect > TestFlight in about 10-30 minutes."

  screenshots:
    if: ${{ inputs.screenshots }}
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Build for the iPhone Simulator
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          npm ci && npx cap sync ios
          printf '%s' "$GOOGLE_SERVICE_INFO_PLIST" | tr -d '\r' > ios/App/App/GoogleService-Info.plist
          REVERSED=$(/usr/libexec/PlistBuddy -c "Print :REVERSED_CLIENT_ID" ios/App/App/GoogleService-Info.plist)
          xcodebuild build -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO \
            GOOGLE_REVERSED_CLIENT_ID="$REVERSED" | tail -n 30; test ${PIPESTATUS[0]} -eq 0
      - name: Take 6.9-inch iPhone screenshots
        run: |
          DEV=$(xcrun simctl list devices available | grep -E "iPhone 1[6-9] Pro Max" | tail -1 | grep -oE '[0-9A-F-]{36}')
          echo "Using simulator $DEV"
          xcrun simctl boot "$DEV" && xcrun simctl bootstatus "$DEV" -b
          xcrun simctl status_bar "$DEV" override --time "9:41" --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularBars 4
          xcrun simctl install "$DEV" "$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator/App.app"
          mkdir -p "$GITHUB_WORKSPACE/screenshots"
          xcrun simctl launch "$DEV" com.aiverse.aivx
          sleep 25
          xcrun simctl io "$DEV" screenshot "$GITHUB_WORKSPACE/screenshots/1-launch.png"
      - uses: actions/upload-artifact@v5
        with:
          name: app-store-screenshots
          path: screenshots/
